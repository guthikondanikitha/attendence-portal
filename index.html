<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIOE Pro Attendance</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="branchOverlay" class="overlay">
        <div class="selection-box">
            <h2>GIOE ATTENDANCE</h2>
            <p>Select Branch & Total Students</p>
            <div class="grid">
                <button onclick="initApp('CPS')">CPS</button>
                <button onclick="initApp('BME')">BME</button>
                <button onclick="initApp('ECE')">ECE</button>
                <button onclick="initApp('CSE')">CSE</button>
                <button onclick="initApp('CCB')">CCB</button>
                <button onclick="initApp('ESE')">ESE</button>
                <button onclick="initApp('EIE')">EIE</button>
                <button onclick="initApp('AIML')">AIML</button>
                <button onclick="initApp('EVE')">EVE</button>
            </div>
            <div class="config-input">
                <label>Class Strength:</label>
                <input type="number" id="classStrength" value="60" min="1">
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <div class="nav-info">
            <h1 id="branchTitle">Portal</h1>
            <small id="liveDate"></small>
        </div>
        <button class="switch-btn" onclick="location.reload()">Switch</button>
    </nav>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>History</h3>
            <span onclick="toggleSidebar()" class="close-x">&times;</span>
        </div>
        <input type="text" id="historySearch" placeholder="Search date..." onkeyup="filterHistory()">
        <div id="historyList"></div>
    </div>

    <main class="container">
        <div id="statusBanner" class="status-banner">Checking...</div>

        <div class="card">
            <div class="input-group">
                <span class="prefix" id="prefixLabel">PIN:</span>
                <input type="text" id="rollInput" placeholder="000" maxlength="3" inputmode="numeric">
                <button id="submitBtn">MARK</button>
            </div>
        </div>

        <div class="card">
            <div class="table-header">
                <h3 id="viewingDate">Today</h3>
                <div class="actions">
                    <button onclick="downloadExcel()" class="excel-btn"><i class="fas fa-file-excel"></i> Excel</button>
                    <button onclick="clearDate()" class="del-btn">Clear All</button>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead><tr><th>PIN</th><th>PERIOD</th><th>TIME</th><th>ACTION</th></tr></thead>
                    <tbody id="attendanceTable"></tbody>
                </table>
            </div>
        </div>

        <div class="card absentee-card">
            <h3>Absentee Analysis</h3>
            <p id="absenteeList">Mark some students to see absentees...</p>
        </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
