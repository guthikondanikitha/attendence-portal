
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIOE Attendance Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="branchOverlay" class="overlay">
        <div class="welcome-container">
            <header class="welcome-header">
                <div class="logo-circle">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <h2>GIOE ATTENDANCE</h2>
                <p>Select a department to manage records</p>
            </header>

            <div class="department-selection">
                <div class="dept-card" onclick="initApp('CPS')"><i class="fas fa-microchip"></i><span>CPS</span></div>
                <div class="dept-card" onclick="initApp('BME')"><i class="fas fa-heartbeat"></i><span>BME</span></div>
                <div class="dept-card" onclick="initApp('ECE')"><i class="fas fa-broadcast-tower"></i><span>ECE</span></div>
                <div class="dept-card" onclick="initApp('CSE')"><i class="fas fa-laptop-code"></i><span>CSE</span></div>
                <div class="dept-card" onclick="initApp('CCB')"><i class="fas fa-network-wired"></i><span>CCB</span></div>
                <div class="dept-card" onclick="initApp('ESE')"><i class="fas fa-leaf"></i><span>ESE</span></div>
                <div class="dept-card" onclick="initApp('EIE')"><i class="fas fa-tools"></i><span>EIE</span></div>
                <div class="dept-card" onclick="initApp('AIML')"><i class="fas fa-brain"></i><span>AIML</span></div>
                <div class="dept-card" onclick="initApp('EVE')"><i class="fas fa-car-battery"></i><span>EVE</span></div>
            </div>

            <div class="setup-bar">
                <span>Class Strength:</span>
                <input type="number" id="classStrength" value="100" min="1" max="150">
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <div class="nav-info">
            <h1 id="branchTitle">Portal</h1>
            <small id="liveDate"></small>
        </div>
        <button class="switch-btn" onclick="location.reload()">Switch</button>
    </nav>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>History</h3>
            <span onclick="toggleSidebar()" class="close-x">&times;</span>
        </div>
        <input type="text" id="historySearch" placeholder="Search date..." onkeyup="filterHistory()">
        <div id="historyList"></div>
    </div>

    <main class="container">
        <div id="statusBanner" class="status-banner">Checking Schedule...</div>

        <div class="card">
            <div class="input-group">
                <span class="prefix" id="prefixLabel">PIN:</span>
                <input type="text" id="rollInput" placeholder="000" maxlength="3" inputmode="numeric">
                <button id="submitBtn">MARK</button>
            </div>
        </div>

        <div class="card">
            <div class="table-header">
                <h3 id="viewingDate">Today</h3>
                <div class="actions">
                    <button onclick="downloadExcel()" class="excel-btn"><i class="fas fa-file-excel"></i> Excel</button>
                    <button onclick="clearDate()" class="del-btn">Clear All</button>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>PIN</th><th>PERIOD</th><th>TIME</th><th>DEL</th></tr>
                    </thead>
                    <tbody id="attendanceTable"></tbody>
                </table>
            </div>
        </div>

        <div class="card absentee-card">
            <h3><i class="fas fa-user-slash"></i> Absentees</h3>
            <p id="absenteeList">Mark attendance to see missing students...</p>
        </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
